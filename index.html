<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101418">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#101418; --card:#1a2027; --card2:#222a33; --line:#2c3640;
  --text:#e8edf2; --dim:#8b97a3; --accent:#4cc38a; --accent-dim:#1e3a2e;
  --warn:#e5a84b; --skip:#5a6672; --input:#0c1013;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font:16px/1.4 -apple-system,system-ui,sans-serif; overscroll-behavior-y:none}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky; top:0; z-index:5; background:rgba(16,20,24,.94);
  backdrop-filter:blur(8px); padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line)}
header h1{margin:0; font-size:17px; font-weight:650}
header .sub{color:var(--dim); font-size:13px; margin-top:2px}
main{padding:12px 12px 24px; max-width:560px; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:12px; margin-bottom:12px}
.card h2{margin:0 0 2px; font-size:16px; font-weight:650}
.card .meta{color:var(--dim); font-size:13px; margin-bottom:8px}
.setrow{display:grid; grid-template-columns:26px 1fr 72px 62px 40px; gap:8px;
  align-items:center; padding:7px 0; border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:none}
.setrow .n{color:var(--dim); font-size:14px; text-align:center}
.setrow .hist{font-size:13px; color:var(--dim); line-height:1.35}
.setrow .hist b{color:var(--text); font-weight:600}
.setrow input{width:100%; background:var(--input); color:var(--text);
  border:1px solid var(--line); border-radius:9px; padding:9px 6px; font-size:16px;
  text-align:center; -moz-appearance:textfield}
.setrow input::-webkit-inner-spin-button{display:none}
.setrow input:focus{outline:none; border-color:var(--accent)}
.setrow.done input{border-color:var(--accent-dim); background:#121a16}
.setrow.skipped{opacity:.45}
.setrow .ok{width:40px; height:40px; border-radius:10px; border:1px solid var(--line);
  background:var(--card2); color:var(--dim); font-size:17px; line-height:1}
.setrow.done .ok{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-dim)}
.exhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.exhead .muscle{color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; flex-shrink:0}
.pill{display:inline-block; background:var(--card2); border:1px solid var(--line);
  color:var(--dim); font-size:12px; border-radius:99px; padding:2px 9px; margin:2px 4px 2px 0}
.pill.sel{background:var(--accent-dim); color:var(--accent); border-color:var(--accent-dim)}
.pillrow{margin-top:6px}
.pillrow .lab{font-size:12px; color:var(--dim); margin-right:4px}
.fb{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line)}
button{font:inherit; cursor:pointer}
.btn{display:block; width:100%; padding:13px; border-radius:12px; border:none;
  background:var(--accent); color:#06130c; font-weight:650; font-size:16px; margin-top:4px}
.btn.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line)}
.btn.small{width:auto; display:inline-block; padding:8px 14px; font-size:14px; margin:0}
.skiplink{background:none; border:none; color:var(--skip); font-size:13px;
  text-decoration:underline; padding:4px 0}
nav{position:fixed; bottom:0; left:0; right:0; display:flex; z-index:5;
  background:rgba(16,20,24,.96); backdrop-filter:blur(8px); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1; background:none; border:none; color:var(--dim); font-size:12px;
  padding:9px 0 7px}
nav button.on{color:var(--accent)}
nav button .ic{display:block; font-size:20px; margin-bottom:1px}
.list-item{display:flex; justify-content:space-between; align-items:center;
  padding:11px 2px; border-top:1px solid var(--line); gap:10px}
.list-item:first-child{border-top:none}
.list-item .l2{color:var(--dim); font-size:13px}
.banner{background:var(--card2); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; font-size:14px; color:var(--dim); margin-bottom:12px}
.banner b{color:var(--text)}
dialog{background:var(--card); color:var(--text); border:1px solid var(--line);
  border-radius:16px; padding:16px; width:min(92vw,420px); margin:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{margin:0 0 10px; font-size:16px}
select,.field input{width:100%; background:var(--input); color:var(--text);
  border:1px solid var(--line); border-radius:9px; padding:10px; font-size:16px; margin:4px 0 10px}
.field label{font-size:13px; color:var(--dim)}
.row2{display:flex; gap:8px}
.row2 .btn{flex:1}
h2.sect{font-size:13px; text-transform:uppercase; letter-spacing:.05em;
  color:var(--dim); margin:18px 4px 8px}
.empty{color:var(--dim); text-align:center; padding:40px 20px; font-size:15px}
</style>
</head>
<body>
<header><h1 id="hd-title">Lift Log</h1><div class="sub" id="hd-sub"></div></header>
<main id="main"></main>
<nav>
  <button data-v="workout" class="on"><span class="ic">🏋️</span>Workout</button>
  <button data-v="plan"><span class="ic">🗓️</span>Meso</button>
  <button data-v="history"><span class="ic">📈</span>History</button>
  <button data-v="insights"><span class="ic">💡</span>Insights</button>
  <button data-v="exercises"><span class="ic">📋</span>Exercises</button>
  <button data-v="settings"><span class="ic">⚙️</span>Settings</button>
</nav>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
